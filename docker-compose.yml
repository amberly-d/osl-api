# Local development only. These credentials must never be used in production.
services:
  postgres:
    image: postgres:16
    container_name: osl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Bind to loopback only; override the host port with POSTGRES_PORT.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - osl-postgres-data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  osl-postgres-data:
